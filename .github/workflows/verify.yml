name: verify

# The cheat sheet claims every Soroban snippet compiles and every behavioural claim
# is asserted. This is what makes that claim falsifiable: `pinned` gates merges,
# `latest` is advisory and tells us the SDK moved under us before a reader finds out.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC; SDK drift shows up as a red build, not a stale doc.
    - cron: '0 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: verify

jobs:
  pinned:
    name: pinned SDK (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verify

      # --locked fails if Cargo.lock would change: the version in the docs/index.md
      # header is the version actually under test, or the build goes red.
      - name: Test against the committed lockfile
        run: cargo test --locked --all-targets

  latest:
    name: latest SDK (advisory)
    runs-on: ubuntu-latest
    # Never blocks a merge; an upstream release breaking us is information,
    # not a reason to stop the queue.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: verify
          key: latest

      # `cargo update` alone stays inside the caret range, so it would never
      # see a new major, and a new soroban-sdk major is exactly the drift
      # worth hearing about. Re-add at latest instead.
      - name: Move to the latest published soroban-sdk
        run: |
          cargo add soroban-sdk
          cargo add --dev soroban-sdk --features testutils
          cargo update

      - name: Test
        run: cargo test --all-targets

      - name: Report the SDK version actually exercised
        if: always()
        run: cargo tree --package soroban-sdk --depth 0 || true
